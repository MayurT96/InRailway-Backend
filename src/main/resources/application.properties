spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-256-bit-production-secret}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
spring.data.redis.repositories.enabled=false
server.port=${SERVER_PORT:8080}
app.seed.pan-india.enabled=${PAN_INDIA_SEED_ENABLED:false}
app.seed.pan-india.schedules=${PAN_INDIA_SCHEDULES_ENABLED:false}